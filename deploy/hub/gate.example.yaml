# gate.yaml - who reaches which server through the hub. See docs/wiki/Gate-yaml.md.
#
# The hub re-reads this file every 30 seconds (at once on `docker compose kill -s HUP hub`).
# A file that does not validate is rejected and the hub keeps the last good one.
# Entries are best added with `awg-gate issue ... --gate gate.yaml` and removed with
# `awg-gate revoke ... --gate gate.yaml`; both keep comments and validate the result.

# What clients dial: the hub's public DNS name (DNS only, never proxied) and the published port.
endpoint: vpn.example.com:443

# Everything below has a default; uncomment to change.
# listen_port: 443              # UDP port inside the container
# profile: v1                   # obfuscation: v1 (every client) or v3 (AmneziaWG 3 clients)
# mtu: 1280                     # safe inside a commercial VPN and on mobile networks
# keepalive: 25                 # seconds, written into issued configurations
# network: 10.247.0.0/16
# servers_subnet: 10.247.0.0/24 # the hub takes the first address, 10.247.0.1
# people_subnet: 10.247.1.0/24

servers:
  # shop-dev:
  #   address: 10.247.0.10
  #   public_key: <from awg-gate issue server>
  #   ports: [443, 80]          # optional: the only ports people reach on it

people:
  # alice:
  #   reach: [shop-dev]         # server names, or ["*"] for all of them
  #   expires: 2027-03-31       # optional: last day of access (UTC), inclusive
  #   devices:
  #     laptop: {address: 10.247.1.10, public_key: <from awg-gate issue person>}
  #     phone:  {address: 10.247.1.11, public_key: <...>}
