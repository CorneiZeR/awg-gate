version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # exec of a fixed program (amneziawg-go, awg, ip, nft) with arguments awg-gate builds itself.
        - G204
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
      # Audited: every path the CLI touches is the operator's own --out/--gate flag; a
      # command-line tool that writes where it is told is the feature, not a traversal.
      - path: ^cmd/awg-gate/main\.go$
        linters: [gosec]
        text: G703


formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CorneiZeR/awg-gate
