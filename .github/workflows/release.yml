name: Release

# A tag vX.Y.Z on master publishes ghcr.io/corneizer/awg-gate:X.Y.Z, :X.Y and :latest for
# amd64 and arm64 - only after the image passed the same vulnerability gate as CI - signs
# it with cosign (keyless) and creates the GitHub release from the CHANGELOG section.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      packages: write   # ghcr.io
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag has a changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## /      { exit }
            on                { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/awg-gate" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: awg-gate:scan
          build-args: VERSION=${{ steps.notes.outputs.version }}
      - name: Trivy - no fixable HIGH or CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: awg-gate:scan
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.notes.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.notes.outputs.version }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ steps.notes.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: GitHub release
        run: |
          fence='```'
          {
            cat release-notes.md
            printf '\n## Image\n\n%s\n%s:%s\n%s@%s\n%s\n' "$fence" "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST" "$fence"
          } > body.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file body.md
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.notes.outputs.image }}
          VERSION: ${{ steps.notes.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
