name: Upstream AmneziaWG tools

# amneziawg-go is a Go module in go.mod and Dependabot raises it. amneziawg-tools is C,
# pinned by tag and commit in the Dockerfile, which Dependabot cannot see: this job opens
# the pull request for a new release instead, and dispatches CI on its branch.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the pull request
      actions: write         # dispatch CI on it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare with the latest release
        id: check
        run: |
          repo=https://github.com/amnezia-vpn/amneziawg-tools.git
          latest=$(git ls-remote --tags --refs "$repo" | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          current=$(sed -n 's/^ARG AWG_TOOLS_REF=//p' Dockerfile)
          echo "current=$current latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then exit 0; fi
          commit=$(git ls-remote "$repo" "refs/tags/$latest^{}" | cut -f1)
          [ -n "$commit" ] || commit=$(git ls-remote "$repo" "refs/tags/$latest" | cut -f1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.check.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          branch="upstream/amneziawg-tools-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists already"; exit 0
          fi
          sed -i "s/^ARG AWG_TOOLS_REF=.*/ARG AWG_TOOLS_REF=$LATEST/; s/^ARG AWG_TOOLS_COMMIT=.*/ARG AWG_TOOLS_COMMIT=$COMMIT/" Dockerfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Dockerfile: amneziawg-tools $LATEST"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Dockerfile: amneziawg-tools $LATEST" \
            --body "A new amneziawg-tools release: https://github.com/amnezia-vpn/amneziawg-tools/releases/tag/$LATEST (commit \`$COMMIT\`). CI was dispatched on this branch; read the upstream changes before merging, and add a CHANGELOG line."
          gh workflow run ci.yml --ref "$branch"
