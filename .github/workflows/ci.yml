name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The upstream workflow dispatches this on the branches it opens: runs a GITHUB_TOKEN
  # push would start are suppressed by GitHub, a dispatch is not.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck (source)
        run: go tool govulncheck ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: shellcheck test/e2e/run.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: awg-gate:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: govulncheck (both binaries in the image)
        run: |
          id=$(docker create awg-gate:ci)
          docker cp "$id:/usr/bin/awg-gate" ./awg-gate.bin
          docker cp "$id:/usr/bin/amneziawg-go" ./amneziawg-go.bin
          docker rm "$id"
          go tool govulncheck -mode=binary ./awg-gate.bin
          go tool govulncheck -mode=binary ./amneziawg-go.bin
      - name: Trivy - no fixable HIGH or CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: awg-gate:ci
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  e2e:
    name: e2e (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [v1, v3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/e2e/run.sh
        env:
          PROFILE: ${{ matrix.profile }}

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every compose file users copy is valid
        run: |
          for f in deploy/*/compose.yaml; do
            echo "== $f"
            docker compose -f "$f" config -q
          done
          IMAGE=x WORK=/tmp docker compose -f test/e2e/compose.yaml config -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: '1'
