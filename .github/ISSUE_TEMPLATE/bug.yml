name: Bug report
description: Something does not work as the documentation says
body:
  - type: markdown
    attributes:
      value: |
        Security issues go through private vulnerability reporting, not here (see SECURITY.md).
        Never paste a configuration file, hub.json, a private key or a public IP you want kept private.
  - type: input
    id: version
    attributes: {label: awg-gate version, description: "`awg-gate version` or the image tag"}
    validations: {required: true}
  - type: dropdown
    id: role
    attributes:
      label: Where
      options: [hub, host spoke, sidecar, Linux client, issue/revoke/check, documentation]
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What happened, and what you expected}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: "Logs and `awg-gate status`", render: text}
